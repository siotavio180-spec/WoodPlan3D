<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17251d"><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"><title>WoodPlan3D</title></head><body><header><b>WoodPlan<span>3D</span></b><small>Plano de corte e visualização de móveis</small></header><main><section id="project" class="screen active"><div class="card"><h1>Novo projeto</h1><p>Informe o móvel, peças e componentes.</p><label>Nome do móvel<input id="name" placeholder="Ex.: Guarda-roupa"></label><label>Descrição<textarea id="desc" rows="2"></textarea></label><button id="voice">🎙️ Falar projeto</button><span id="voiceStatus"></span><div class="title"><h2>Peças</h2><button id="add">+ Adicionar</button></div><div id="pieces"></div><div class="title"><h2>Componentes</h2><button id="addComp">+ Adicionar</button></div><div id="components"></div><div class="info"><b>Chapa padrão</b><span>1,84 × 2,75 m • 18 mm</span></div><button id="confirm" class="primary">Confirmar projeto</button></div></section><section id="cut" class="screen"><div class="card"><div class="title"><div><h1>Plano de corte</h1><p id="summary"></p></div><button data-go="project">← Projeto</button></div><canvas id="canvas"></canvas><div id="legend"></div><button id="go3d" class="primary">Ver móvel em 3D →</button></div></section><section id="view3d" class="screen"><div class="card"><div class="title"><div><h1>Visualização 3D</h1><p>Arraste para girar • pinça para zoom</p></div><button data-go="cut">← Corte</button></div><div id="viewer"></div><button id="reset">↺ Centralizar</button></div></section></main><nav><button data-go="project">📐<small>Projeto</small></button><button data-go="cut">🪚<small>Corte</small></button><button data-go="view3d">🧊<small>3D</small></button></nav><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script><script src="app.js"></script></body></html>
